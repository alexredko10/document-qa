apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default

  sources:
  - repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 13.5.0
    helm:
      releaseName: grafana
      valuesObject:
        replicas: 1

        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password

        service:
          type: ClusterIP
          port: 80

        ingress:
          enabled: false

        persistence:
          enabled: false

        rbac:
          create: false

        serviceAccount:
          automountServiceAccountToken: false

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 768Mi

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.monitoring.svc.cluster.local:80
                isDefault: true
                editable: false
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://loki.monitoring.svc.cluster.local:3100
                isDefault: false
                editable: false
                jsonData:
                  derivedFields:
                    - name: trace_id
                      matcherRegex: '"trace_id":"([0-9a-fA-F]{32})"'
                      datasourceUid: tempo
                      url: '$${__value.raw}'
                      urlDisplayLabel: View Trace
              - name: Tempo
                uid: tempo
                type: tempo
                access: proxy
                url: http://tempo.monitoring.svc.cluster.local:3200
                isDefault: false
                editable: false
                jsonData:
                  tracesToLogsV2:
                    datasourceUid: loki
                    spanStartTimeShift: 1h
                    spanEndTimeShift: 1h
                    tags:
                      - key: service.name
                    filterByTraceID: false
                    filterBySpanID: false
                    customQuery: true
                    query: '{namespace="qa",app="qa-prototype",container="api"} | json | trace_id="$${__trace.traceId}"'

        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: document-qa
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/document-qa-dashboards
                  updateIntervalSeconds: 30

        extraConfigmapMounts:
          - name: document-qa-dashboard
            configMap: document-qa-dashboard
            mountPath: /var/lib/grafana/document-qa-dashboards
            readOnly: true

        grafana.ini:
          auth.anonymous:
            enabled: false
          users:
            allow_sign_up: false

  - repoURL: https://github.com/alexredko10/document-qa.git
    targetRevision: main
    path: document-qa/deploy/grafana

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
