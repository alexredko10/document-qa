apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.40.3
    helm:
      releaseName: prometheus
      valuesObject:
        rbac:
          create: false

        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false

        # 2 target, without Kubernetes auto-discovery.
        scrapeConfigs:
          prometheus:
            enabled: true

          kubernetes-api-servers:
            enabled: false
          kubernetes-nodes:
            enabled: false
          kubernetes-nodes-cadvisor:
            enabled: false
          kubernetes-pods:
            enabled: false
          kubernetes-pods-slow:
            enabled: false
          kubernetes-service-endpoints:
            enabled: false
          kubernetes-service-endpoints-slow:
            enabled: false
          kubernetes-services:
            enabled: false
          prometheus-pushgateway:
            enabled: false
            
        extraScrapeConfigs: |
          - job_name: document-qa
            scrape_interval: 15s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - qa-prototype.qa.svc.cluster.local:80
        server:
          automountServiceAccountToken: false
          retention: 24h
          retentionSize: 256MB

        # Minimum volumes keep percentage and percentile alerts useful at lab traffic levels.
        serverFiles:
          alerting_rules.yml:
            groups:
              - name: document-qa
                rules:
                  - alert: DocumentQADown
                    expr: up{job="document-qa"} == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: Document QA scrape target is down
                      description: Prometheus has failed to scrape the application target for 2 minutes.
                  - alert: DocumentQAHighErrorRate
                    expr: |
                      (
                        sum(rate(http_requests_total{job="document-qa",route!~"/healthz|/metrics",status=~"5.."}[5m]))
                        /
                        sum(rate(http_requests_total{job="document-qa",route!~"/healthz|/metrics"}[5m]))
                      ) > 0.01
                      and
                      sum(increase(http_requests_total{job="document-qa",route!~"/healthz|/metrics"}[5m])) >= 20
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: Document QA HTTP 5xx rate is above 1%
                      description: More than 1% of eligible requests returned 5xx, with at least 20 requests in the last 5 minutes.
                  - alert: DocumentQASlowLLM
                    expr: |
                      histogram_quantile(
                        0.95,
                        sum by (le) (rate(llm_call_duration_seconds_bucket{job="document-qa",provider="openrouter"}[10m]))
                      ) > 20
                      and
                      sum(increase(llm_call_duration_seconds_count{job="document-qa",provider="openrouter"}[10m])) >= 20
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: Document QA OpenRouter p95 latency is above 20 seconds
                      description: OpenRouter p95 latency has exceeded 20 seconds with at least 20 calls in the last 10 minutes.

          persistentVolume:
            enabled: false

          emptyDir:
            sizeLimit: 512Mi

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
