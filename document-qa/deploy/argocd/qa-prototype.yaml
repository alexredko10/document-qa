apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qa-prototype
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/alexredko10/document-qa.git
    targetRevision: main
    path: document-qa-prototype/deploy/charts/qa-prototype
    helm:
      releaseName: qa-prototype
      valueFiles:
        - values-aws.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: qa

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
