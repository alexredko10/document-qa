apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/grafana-community/helm-charts
    path: .
    targetRevision: 21.0.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: Monolithic
        rbac:
          namespaced: true
        sidecar:
          rules:
            enabled: false
        serviceAccount:
          automountServiceAccountToken: false
        memcached:
          enabled: false
          serviceAccount:
            create: false
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 24h
          compactor:
            retention_enabled: true
            working_directory: /var/loki/compactor
            delete_request_store: filesystem
        singleBinary:
          replicas: 1
          sidecar: false
          persistence:
            enabled: false
            dataVolumeParameters:
              emptyDir:
                sizeLimit: 2Gi
          podDisruptionBudget:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        monitoring:
          selfMonitoring:
            enabled: false
          serviceMonitor:
            enabled: false
        rollout_operator:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
