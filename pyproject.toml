[project]
name = "document-qa-prototype"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "pytest>=9.2.0",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ['app']