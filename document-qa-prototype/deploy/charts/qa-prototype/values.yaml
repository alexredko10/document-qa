# GitOps must pin images by immutable digest; do not use :latest.
replicaCount: 1
image:
  repository: ghcr.io/alexredko10/document-qa
  digest: ""  # Inject --set-string image.digest=sha256:... or commit the digest in GitOps values.
  pullPolicy: IfNotPresent

llm:
  provider: stub
  model: openrouter/free
  openRouterSecretName: qa-openrouter

embedding:
  provider: hash
  model: openai/text-embedding-3-small

service:
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
