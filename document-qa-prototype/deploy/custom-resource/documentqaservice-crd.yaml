apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: documentqaservices.platform.example.com
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    plural: documentqaservices
    singular: documentqaservice
    kind: DocumentQAService
    shortNames: [dqas]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [llmProvider, embeddingProvider]
              properties:
                llmProvider:
                  type: string
                  enum: [stub, openrouter]
                embeddingProvider:
                  type: string
                  enum: [hash, openrouter]
                llmModel:
                  type: string
                  minLength: 1
                  maxLength: 256
                embeddingModel:
                  type: string
                  minLength: 1
                  maxLength: 256
                openRouterSecretName:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        enum: [Ready]
                      status:
                        type: string
                        enum: ['True', 'False', Unknown]
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 128
                      message:
                        type: string
                        maxLength: 1024
                      lastTransitionTime:
                        type: string
                        format: date-time
