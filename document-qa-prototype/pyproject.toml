[project]
name = "document-qa-prototype"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]