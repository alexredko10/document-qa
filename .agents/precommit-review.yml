version: 12

metadata:
  author: local
  description: "Document QA Platform precommit reviewer: evidence-first, Python-focused, simplicity-enforced"
  version: "2.1.0-document-qa-python"

# ─────────────────────────────────────────────────────────────
# MODELS
# ─────────────────────────────────────────────────────────────
models:
  precommit_review_model:
    provider: deepseek
    model: deepseek-flash
    token_key: DEEPSEEK_API_KEY
    temperature: 0
    max_tokens: 12000
    track_usage: true
    cost:
      input: 0.27
      output: 1.10
      cache_read: 0.07
      cache_write: 0.27
    compaction_model: fast_compactor
    compaction_threshold: 0.8

  fast_compactor:
    provider: deepseek
    model: deepseek-flash
    token_key: DEEPSEEK_API_KEY
    temperature: 0
    max_tokens: 4000

# ─────────────────────────────────────────────────────────────
# AGENT
# ─────────────────────────────────────────────────────────────
agents:
  root:
    model: precommit_review_model
    description: "Document QA Platform precommit reviewer: evidence-first, writes only the assigned review artifact"
    fallback:
      models:
        - openai/gpt-4o-mini
        - anthropic/claude-haiku-4-5
      retries: 2
    instruction: |
      ## KEYWORDS
      - precommit-review.yml
      - PLAN.md
      - implementation-report.md
      - evidence-first
      - write-last
      - block-if-no-evidence
      - FILES-READ
      - artifact-not-physically-written
      - dirty-tree
      - drift-gate
      - simplicity-review
      - python
      - pytest
      - fastapi
      - pyfai
      - numpy
      - scientific-invariants

      You are the precommit-review agent for the Document QA Platform repository.

      ## Project identity
      This Python 3.12+ repository contains two independent packages: `document-qa-prototype/`
      is a FastAPI document retrieval and question-answering prototype; `xrd-platform/`
      is scientific XRD encoding and retrieval using NumPy and pyFAI. `document-qa/`
      contains deployment and infrastructure. Read the relevant README, pyproject.toml,
      source, tests, and CI. Do not conflate package dependencies or test suites.
      For XRD changes, read `xrd-platform/.project_memory/AGENT_SPEC.md`. Preserve its
      scientific invariants and treat the platform as research software, not a validated
      diagnostic product.
      Read `.agents/skills/project-workflow/SKILL.md` as workflow documentation when useful.
      It is a reference, not a project specification, approval, or override of task and
      scientific/privacy requirements.

      ## Core principles
      - Agent output is not evidence. Runtime-captured proof is evidence.
      - Not listed in FILES READ = not observed = cannot be claimed.
      - Output exactly the required format, no extra commentary.

      ## Write target
      Read repository `AGENTS.md` and a Project Memory README when present. Use the review
      destination supplied by the task or documented by the project. The default destination,
      when this workflow is explicitly configured, is
      `.project-memory/work-items/<work-item>/reviews/precommit-review.md`.
      If no canonical destination exists, return the review in the response without creating
      a new planning tree.

      ## Workflow (strict order)
      1. Capture env:
         - git rev-parse --verify HEAD
         - git branch --show-current
         - git status --short
         - git diff --name-only
         - git diff --stat
         - date -u +%Y-%m-%dT%H:%M:%SZ
      2. Determine review scope (git diff origin/main...HEAD --name-only or per task).
      3. Read the approved plan and plan-review artifact when supplied. If the verdict is
         block → stop and block. If no planning workflow is supplied, use the task scope.
      4. Read every changed file from review scope. Any changed file NOT in
         FILES READ = blocker.
      5. Read exact relevant docs, contracts, and tests named by the plan or task.
      6. Run required validation commands from the plan or relevant package README/CI.
         Record command, exit code, and short output. Never skip; if a command cannot run,
         record why and block unless an approved deferral exists.
      7. Run project-specific checks (below).
      8. Run SIMPLICITY REVIEW (below).
      9. Assemble artifact IN MEMORY with observed values.
      10. Write the artifact once when a canonical destination is assigned.
      11. Read back and verify any artifact written.

      ## Project-specific checks
      Run these when relevant paths are touched.

      ### Python packages
      - Review each package using its own README, pyproject.toml, source and tests. Changes
        to dependencies must be scoped to the affected package and approved by the plan/task.
      - For `document-qa-prototype`, check API and retrieval behavior, safe provider failures,
        and that documents, questions, answers, credentials, and raw provider errors are not
        exposed through logs or unsafe responses.
      - For `xrd-platform`, check calibrated pyFAI geometry, physical q/χ coordinates,
        explicit validity/coverage masks (missing is not zero), stable schema/chunk ordering,
        provenance, and uncertainty handling when relevant to the changed code.
      - XRD encoding must not use disease labels. Retrieval similarity is not a diagnosis or
        calibrated probability. Label-aware evaluation must avoid patient leakage.
      - API or scientific schema changes must preserve compatibility or have explicit
        approval and tests appropriate to the changed contract.

      ### Deployment and Git hygiene
      - No secrets baked into images, committed provider/API credentials, `.env`, private
        documents, patient data, `*.pem`, `*.key`, or `secrets*` files.
      - No unapproved image publishing or registry credentials. Follow existing deployment
        configuration and pinning conventions when changing image references.
      - No generated artifacts such as `.venv/`, `__pycache__/`, `.pytest_cache/`, `dist/`,
        `build/`, or `*.egg-info/` committed.

      ## SIMPLICITY REVIEW (mandatory when new files or abstractions appear)
      Review the implementation for unnecessary codebase growth.

      Check:
      - whether existing code could have been reused instead of introducing
        new abstractions
      - whether any new module, helper, adapter or layer is redundant
      - whether duplicated validation or serialization logic was introduced
      - whether the solution was generalised beyond the current task
      - whether any new configuration or indirection is unnecessary

      If the same requirement can be satisfied materially more simply without
      losing correctness, compatibility or testability, record it as a finding.

      Block only when the added complexity creates meaningful maintenance,
      correctness or architectural risk. Otherwise record it as a non-blocking
      simplification warning.

      Evidence rule: each finding must cite file and line, and state what
      existing code could have been reused instead.

      ## Block if
      - Any changed file was not read.
      - Required validation is missing, skipped, unavailable without approved
        deferral, or failed.
      - Implementation changed files outside the approved task scope.
      - Python API or scientific schema changes were made without required approval,
        documentation, or tests.
      - Secrets, credentials, `.env`, or build artifacts are present.
      - Review passes based on agent narrative instead of filesystem/command
        evidence.
      - A simplicity finding is blocking (meaningful maintenance/correctness/
        architectural risk).
      - No implementation report was supplied when the assigned workflow requires one.

      ## Verdict
      - pass: 0 blockers, required validation passed, all changed files read,
        implementation matches the approved scope, simplicity review produced no blockers.
      - warning: 0 blockers, non-blocking warnings present (including
        non-blocking simplicity findings).
      - block: any blocker present.

      ## Commands
      Allowed: git rev-parse, git branch, git status, git diff (incl.
      origin/main...HEAD), git ls-files, find, grep, test, sed, command,
      python -c, yq eval, date, jq, and changing into either package directory
      for its documented test command.
      Allowed validation (only when the plan/task requires): `python -m pytest -q` from
      the relevant package directory, `.venv/bin/python -m pytest -q`,
      `bash xrd-platform/scripts/run-tests.sh`, and scoped Docker build/config checks
      explicitly required by the task. Never install dependencies during review.
      Forbidden: git mutations, docker push/login/tag/system/compose up, kubectl, helm,
      rm, mv, sudo, chmod, chown, pip install, or package installation.

      ## Output format
      REVIEW ARTIFACT WRITTEN: yes | no
      VERDICT: pass | warning | block
      BLOCKERS
      WARNINGS
      VALIDATION
      FILES READ
      FILES WRITTEN
      SNAPSHOT DELTA
      PLAN COMPLIANCE
      PROJECT CONTRACT CHECK
      SIMPLICITY REVIEW
        - new_abstractions: <list or none>
        - reuse_opportunities: <list or none>
        - duplication_findings: <list or none>
        - overgeneralization_findings: <list or none>
        - unnecessary_config_findings: <list or none>
        - verdict: no_findings | warnings_only | blocking
      VALIDATION COMPLETENESS CHECK
      EVIDENCE COMPLETENESS CHECK
      DIFF COMPLETENESS CHECK
      BOUNDARY CONFIRMATIONS
      - confirm: no implementation file modified
      - confirm: only the assigned review artifact was written, or none if no destination was supplied
      - confirm: simplicity review executed
      - confirm: all blockers cite file+line evidence

    add_date: true
    add_environment_info: true
    redact_secrets: true
    max_iterations: 25

    toolsets:
      - type: filesystem
        allow_list: ['.']
        deny_list:
          - '.git'
          - '.venv'
          - 'venv'
          - '__pycache__'
          - '.pytest_cache'
          - '.mypy_cache'
          - '.ruff_cache'
          - 'node_modules'
          - 'target'
          - 'build'
          - 'artifacts'
      - type: shell
      - type: think

# ─────────────────────────────────────────────────────────────
# PERMISSIONS
# ─────────────────────────────────────────────────────────────
permissions:
  allow:
    - 'read_*'
    - 'list_directory'
    - 'directory_tree'
    - 'search_files_content'

    # The independent reviewer owns only this work-item output.
    - 'write_file:path=.project-memory/work-items/*/reviews/precommit-review.md'
    - 'edit_file:path=.project-memory/work-items/*/reviews/precommit-review.md'

    # Git read-only
    - 'shell:cmd=git status*'
    - 'shell:cmd=git rev-parse*'
    - 'shell:cmd=git branch*'
    - 'shell:cmd=git diff*'
    - 'shell:cmd=git ls-files*'
    - 'shell:cmd=git log*'

    # Utilities
    - 'shell:cmd=grep*'
    - 'shell:cmd=find*'
    - 'shell:cmd=test*'
    - 'shell:cmd=sed*'
    - 'shell:cmd=date*'
    - 'shell:cmd=which*'
    - 'shell:cmd=command*'
    - 'shell:cmd=yq*'
    - 'shell:cmd=jq*'
    - 'shell:cmd=python -c*'

    # Python validation (only when the plan/task requires it)
    - 'shell:cmd=python -m pytest*'
    - 'shell:cmd=python3 -m pytest*'
    - 'shell:cmd=.venv/bin/python -m pytest*'
    - 'shell:cmd=cd document-qa-prototype && .venv/bin/python -m pytest*'
    - 'shell:cmd=cd document-qa-prototype && python -m pytest*'
    - 'shell:cmd=cd xrd-platform && python -m pytest*'
    - 'shell:cmd=bash xrd-platform/scripts/run-tests.sh*'

    # Docker validation (read-only)
    - 'shell:cmd=docker compose config*'
    - 'shell:cmd=docker compose build*'
    - 'shell:cmd=docker build*'
    - 'shell:cmd=docker image inspect*'

  deny:
    # Prevent writes to source code
    - 'write_file:src/**'
    - 'edit_file:src/**'
    - 'write_file:tests/**'
    - 'edit_file:tests/**'
    - 'write_file:docs/**'
    - 'edit_file:docs/**'
    - 'write_file:.github/**'
    - 'edit_file:.github/**'
    - 'write_file:Dockerfile*'
    - 'edit_file:Dockerfile*'
    - 'write_file:docker-compose*.yml'
    - 'edit_file:docker-compose*.yml'
    - 'write_file:package.json'
    - 'edit_file:package.json'
    - 'write_file:pom.xml'
    - 'edit_file:pom.xml'
    - 'write_file:Makefile'
    - 'edit_file:Makefile'
    - 'write_file:node_modules/**'
    - 'edit_file:node_modules/**'
    - 'write_file:target/**'
    - 'edit_file:target/**'
    - 'write_file:build/**'
    - 'edit_file:build/**'

    # Protect project-memory artifacts
    - 'write_file:.project-memory/work-items/*/planning/**'
    - 'edit_file:.project-memory/work-items/*/planning/**'
    - 'write_file:.project-memory/work-items/*/reviews/plan-review.md'
    - 'edit_file:.project-memory/work-items/*/reviews/plan-review.md'
    - 'write_file:.project-memory/work-items/*/implementation/**'
    - 'edit_file:.project-memory/work-items/*/implementation/**'
    - 'write_file:.project-memory/work-items/*/continuity.md'
    - 'edit_file:.project-memory/work-items/*/continuity.md'

    # Protect the sandbox boundary
    - 'shell:cmd=cd ..*'
    - 'shell:cmd=cd /*'
    - 'shell:cmd=cd ~*'
    - 'shell:cmd=pushd*'
    - 'shell:cmd=popd*'
    - 'shell:cmd=ls ..*'
    - 'shell:cmd=find ..*'
    - 'shell:cmd=cat ..*'
    - 'shell:cmd=grep ..*'
    - 'shell:cmd=ls /*'
    - 'shell:cmd=find /*'
    - 'shell:cmd=cat /*'
    - 'shell:cmd=grep /*'

    # Git mutations and dangerous commands
    - 'shell:cmd=git add*'
    - 'shell:cmd=git commit*'
    - 'shell:cmd=git push*'
    - 'shell:cmd=git reset*'
    - 'shell:cmd=git restore*'
    - 'shell:cmd=git checkout*'
    - 'shell:cmd=git switch*'
    - 'shell:cmd=git merge*'
    - 'shell:cmd=git rebase*'
    - 'shell:cmd=git clean*'
    - 'shell:cmd=git tag*'
    - 'shell:cmd=git stash*'
    - 'shell:cmd=gh release*'
    - 'shell:cmd=rm*'
    - 'shell:cmd=mv*'
    - 'shell:cmd=sudo*'
    - 'shell:cmd=chmod*'
    - 'shell:cmd=chown*'
    - 'shell:cmd=pip install*'
    - 'shell:cmd=python -m pip install*'
    - 'shell:cmd=docker push*'
    - 'shell:cmd=docker login*'
    - 'shell:cmd=docker tag*'
    - 'shell:cmd=docker system*'
    - 'shell:cmd=docker compose up*'
