name: Document QA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: document-qa-prototype
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests without API keys
        working-directory: document-qa-prototype
        env:
          LLM_PROVIDER: stub
        run: python -m pytest -q

  container:
    name: Build, scan and publish ARM64
    needs: test
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Linux ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./document-qa-prototype
          platforms: linux/arm64
          load: true
          push: false
          tags: ghcr.io/alexredko10/document-qa:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/alexredko10/document-qa
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/alexredko10/document-qa:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          IMAGE="ghcr.io/alexredko10/document-qa:sha-${GITHUB_SHA}"

          docker push "$IMAGE"

          DIGEST="$(docker buildx imagetools inspect "$IMAGE" \
            | awk '/^Digest:/ {print $2; exit}')"

          test -n "$DIGEST"

          echo "Published: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: \`ghcr.io/alexredko10/document-qa@$DIGEST\`" \
            >> "$GITHUB_STEP_SUMMARY"
